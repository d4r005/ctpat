name: Android Build Release APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        working-directory: frontend
        run: npm install --legacy-peer-deps

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Symlink node_modules para Gradle
        run: |
          # settings.gradle usa workingDir(rootDir) = frontend/android/
          # pero node_modules están en frontend/ — symlink resuelve el problema
          ln -s ${{ github.workspace }}/frontend/node_modules \
                ${{ github.workspace }}/frontend/android/node_modules
          echo "Symlink creado: frontend/android/node_modules -> frontend/node_modules"
          ls -la ${{ github.workspace }}/frontend/android/node_modules | head -5

      - name: Build Release APK
        working-directory: frontend/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease -x lint --no-daemon \
            -Dorg.gradle.project.reactNativeArchitectures="arm64-v8a"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SRIUC-Final-APK
          path: frontend/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30
